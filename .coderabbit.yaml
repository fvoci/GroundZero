# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
inheritance: false
tone_instructions: >-
  간결하고 균형 잡힌 한국어로 검토한다. 문제의 재현 조건, 실제 영향과 최소 수정안을 설명하고
  확실한 결함과 확인이 필요한 추정을 구분한다. 취향에 따른 지적과 반복 설명은 줄인다.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  sequence_diagrams: false
  poem: false
  auto_review:
    enabled: true
    drafts: true
    # Stacked PRs may target another working branch instead of main.
    base_branches: ['.*']
  path_instructions:
    - path: '**'
      instructions: >-
        AGENTS.md와 docs/decisions.md의 확정 원칙을 따른다.
        변경으로 생기는 실제 오류, 서버 권한 검사와 비공개 데이터·시크릿 유출,
        트랜잭션·동시성·재시도·삭제/복원의 데이터 정합성, API 계약과 시간대 경계 오류를 우선한다.
        문제를 지적할 때 구체적인 실패 경로와 필요한 검증을 설명한다.
        기존 검사와 중복되는 지적, 필요가 입증되지 않은 추상화·범용 프레임워크·범위 밖 재설계를 요구하지 않는다.
  finishing_touches:
    # One-off Fix comments only; ongoing Autofix has a separate task/PR control.
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []

chat:
  art: false
