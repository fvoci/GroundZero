# One-off test database procedure. Never dispatch automatically or from PR code.
name: supabase-cloud-rebuild

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run one phase; inspect and approve its fingerprint before rebuild
        required: true
        type: choice
        options:
          - inspect
          - rebuild
          - verify
      approved_fingerprint:
        description: Exact fingerprint from inspect at this SHA (required for rebuild)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-cloud-rebuild
  cancel-in-progress: false

jobs:
  database:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'fvoci/GroundZero' && github.ref == 'refs/heads/main' }}
    # The owner must configure required reviewers and main-only deployment before dispatch.
    # Verify also makes synthetic writes (rolled back), so every phase uses this Environment.
    environment: supabase-cloud-rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build reviewed xtask and product before injecting credentials
        timeout-minutes: 15
        env:
          FVOCI_CLOUD_BUILD_SHA: ${{ github.sha }}
        run: cargo build --locked --package xtask --package fvoci-server
      - name: Run the selected phase
        timeout-minutes: 4
        env:
          SUPABASE_REBUILD_PHASE: ${{ inputs.phase }}
          SUPABASE_REBUILD_APPROVED_FINGERPRINT: ${{ inputs.approved_fingerprint }}
          SUPABASE_REBUILD_HOST: ${{ secrets.SUPABASE_REBUILD_HOST }}
          SUPABASE_REBUILD_ADMIN_USER: ${{ inputs.phase != 'verify' && secrets.SUPABASE_REBUILD_ADMIN_USER || '' }}
          SUPABASE_REBUILD_ADMIN_PASSWORD: ${{ inputs.phase != 'verify' && secrets.SUPABASE_REBUILD_ADMIN_PASSWORD || '' }}
          SUPABASE_REBUILD_SSL_ROOT_CERT: ${{ secrets.SUPABASE_REBUILD_SSL_ROOT_CERT }}
          SUPABASE_REBUILD_MIGRATOR_PASSWORD: ${{ inputs.phase != 'inspect' && secrets.SUPABASE_REBUILD_MIGRATOR_PASSWORD || '' }}
          SUPABASE_REBUILD_APP_PASSWORD: ${{ inputs.phase != 'inspect' && secrets.SUPABASE_REBUILD_APP_PASSWORD || '' }}
        run: target/debug/xtask supabase-cloud-rebuild "$SUPABASE_REBUILD_PHASE" --connect
