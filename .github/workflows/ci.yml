# 제품 검사. 로컬과 같은 진입점(cargo xtask check / cargo xtask test)만 호출한다.
# 모든 job은 base-image 워크플로가 게시한 같은 이미지 digest 안에서 돈다. 태그나 latest로 실행하지 않는다.
# digest는 저장소 변수 CI_BASE_IMAGE_DIGEST (sha256:...)에 둔다. 비어 있으면 image 참조가 잘못되어 job이 시작 단계에서 실패한다. 성공으로 처리하지 않는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    # 컨테이너 job 안에서는 Compose를 띄울 수 없으므로 job 서비스로 격리한다. 자격 증명은 compose.test.yaml과 같은 테스트 값.
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: fvoci
          POSTGRES_PASSWORD: fvoci-test-password
          POSTGRES_DB: fvoci
        options: >-
          --health-cmd "pg_isready -U fvoci -d fvoci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.37.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: fvoci-test-meili-master-key-16chars
          MEILI_NO_ANALYTICS: 'true'
    env:
      DATABASE_URL: postgres://fvoci:fvoci-test-password@postgres:5432/fvoci
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test --external-services
