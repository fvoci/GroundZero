# 제품 검사. 로컬과 같은 xtask 진입점을 호출한다.
# 컨테이너 검사는 base-image 워크플로의 digest를 쓴다. Compose를 직접 다루는 작업은 고정 도구의 호스트 러너에서 돈다.
# digest는 저장소 변수 CI_BASE_IMAGE_DIGEST (sha256:...)에 둔다. 비어 있으면 image 참조가 잘못되어 job이 시작 단계에서 실패한다. 성공으로 처리하지 않는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 변경 경로로 이번 실행이 돌 job을 정한다(#146·#155, 판별과 경로 표는 xtask/src/ci_plan.rs). PR만 좁히고 push(main)는
  # 전체를 돈다. 건너뛴 job은 결론이 skipped로만 보이므로 사유는 이 job의 실행 요약과 알림에 남는다.
  # 아래 job은 출력이 'false'일 때만 건너뛴다. 이 job이 실패하면 출력이 비어 모두 돌고, 이 job은 실패로 남는다.
  # PR 병합 커밋을 첫 부모(기준 브랜치)와 비교하므로 깊이 2로 받는다. git이 체크아웃 소유자와 같은 사용자로 돌도록
  # 컨테이너가 아니라 호스트 러너에서 돈다(툴체인은 rust-toolchain.toml).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      licenses: ${{ steps.plan.outputs.licenses }}
      integration: ${{ steps.plan.outputs.integration }}
      browser: ${{ steps.plan.outputs.browser }}
      oidc: ${{ steps.plan.outputs.oidc }}
      supabase: ${{ steps.plan.outputs.supabase }}
      rhwp: ${{ steps.plan.outputs.rhwp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: plan
        run: cargo xtask ci-plan --event "$GITHUB_EVENT_NAME"

  # 문서 전용 PR이면 서식 검사만 돌고 나머지 단계는 SKIP으로 남는다(#146).
  check:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # pnpm은 Corepack이 packageManager의 판·sha512대로 실행한다(이미지의 다른 pnpm이 아니라). 쓰인 판을 로그에 남긴다.
      - run: corepack enable pnpm && rustc -V && node -v && corepack --version && pnpm -v
      - run: pnpm install --frozen-lockfile
      # 라이선스는 아래 licenses job이 따로 보인다(D-60 승인 대기 중 실패가 다른 검사 결과를 가리지 않게).
      - if: needs.changes.outputs.docs_only != 'true'
        run: cargo xtask check --skip-licenses
      - if: needs.changes.outputs.docs_only == 'true'
        run: cargo xtask check --skip-licenses --docs-only

  # 의존성 라이선스(D-60). 허용 목록 밖이면 실패로 그대로 보인다. 다른 job은 이 결과를 기다리지 않는다.
  licenses:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.licenses != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable pnpm && rustc -V && node -v && corepack --version && pnpm -v
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask licenses

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    # 컨테이너 job 안에서는 Compose를 띄울 수 없으므로 job 서비스로 격리한다. 자격 증명은 compose.test.yaml과 같은 테스트 값.
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: fvoci
          POSTGRES_PASSWORD: fvoci-test-password
          POSTGRES_DB: fvoci
        options: >-
          --health-cmd "pg_isready -U fvoci -d fvoci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.37.0@sha256:9cde2774864e6c19cdd09fcd2950bc01ac9a0454b6f343fffafa14faae6eb7ea
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: fvoci-test-meili-master-key-16chars
          MEILI_NO_ANALYTICS: 'true'
    env:
      # 관리자(fvoci)는 job 서비스의 POSTGRES_USER. 마이그레이션·앱 역할은 xtask가 `db bootstrap`으로 만든다.
      FVOCI_TEST_PG_HOST_PORT: postgres:5432
      FVOCI_TEST_SEARCH_URL: http://meilisearch:7700
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask test --external-services

  # S3 저장소 테스트(s3_*)는 SeaweedFS에 시작 인자(사용 통계 끄기 등)가 필요해 job 서비스로 띄울 수 없으므로
  # 아래 Compose job에서만 돈다(위 job은 NOT RUN으로 표시).
  # Keycloak을 거치는 OIDC 로그인 테스트. 컨테이너 job 안에서는 Compose를 띄울 수 없으므로 GitHub 호스트 러너에서
  # compose.test.yaml + compose.test.pg18.yaml(oidc 프로필)로 상위 메이저 18도 검증한다. 기본 integration은 최소 17을 검증한다.
  # 테스트는 위 job과 같은 베이스 이미지 안에서 같은 진입점으로 돈다.
  # 프로젝트명에 실행 번호·재시도 번호를 넣어 실행마다 컨테이너·네트워크·볼륨을 분리하고, 결과와 상관없이 지운다.
  # Docker 소켓은 테스트 컨테이너에 넘기지 않는다(체크아웃만 마운트).
  oidc:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.oidc != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROJECT: fvoci-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: services (postgres 18, meilisearch, keycloak)
        run: docker compose --project-name "$PROJECT" --file deploy/compose.test.yaml --file deploy/compose.test.pg18.yaml --profile oidc up --detach --wait
      - name: cargo xtask test --external-services --oidc (base image)
        run: >-
          docker run --rm --network "${PROJECT}_default"
          --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/work" --workdir /work
          --env HOME=/work/target/ci-home
          --env CARGO_HOME=/work/target/ci-cargo
          --env FVOCI_TEST_PG_HOST_PORT=postgres:5432
          --env FVOCI_TEST_SEARCH_URL=http://meilisearch:7700
          --env FVOCI_TEST_S3_ENDPOINT=http://seaweedfs:8333
          --env FVOCI_TEST_OIDC_ISSUER=http://keycloak:8080/realms/fvoci-test
          "$IMAGE" cargo xtask test --external-services --oidc
      - name: compose down
        if: always()
        run: docker compose --project-name "$PROJECT" --file deploy/compose.test.yaml --file deploy/compose.test.pg18.yaml --profile oidc down --volumes --remove-orphans

  # 셀프호스트 Supabase를 DB로(D-88). 공식 구성을 고정 revision으로 받아 db·rest·supavisor만 띄우고(이미지 digest 고정,
  # 127.0.0.1 포트) 같은 통합 테스트를 직접 연결과 Supavisor session 모드로 두 번 돈다. 호스트의 Docker 포트를 쓰므로
  # base 이미지 컨테이너가 아니라 러너에서 돈다(툴체인은 rust-toolchain.toml).
  supabase:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.supabase != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask test --supabase --session-pooler --oidc

  # 실제 API·DB·OIDC를 쓰는 Chromium 회귀. 브라우저/서비스 생명주기는 로컬과 같은 xtask가 소유한다.
  browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.browser != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: pinned Node and Corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable pnpm
          rustc -V
          node -v
          corepack --version
          pnpm -v
      - run: pnpm install --frozen-lockfile
      # Playwright와 Chromium revision은 lockfile의 정확한 @playwright/test 판으로 함께 고정된다.
      - run: pnpm --filter @fvoci/web exec playwright install --with-deps chromium
      - run: cargo xtask browser
      - name: browser failure evidence
        # xtask는 검증한 파일만 이 폴더에 게시하고 마지막에 표시 파일을 쓴다. 검증 실패 원본은 업로드하지 않는다.
        if: failure() && hashFiles('target/browser/artifacts/SAFE_TO_UPLOAD') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/browser/artifacts/
          if-no-files-found: warn
          retention-days: 7

  # HWP·HWPX 미리보기 WASM(D-76). 제품 이미지와 같은 단계(rhwp-out)를 만든다. 빌드 안에서 브라우저에 들어가는
  # 그래프만 cargo-deny로 검사한다(취약점·회수·라이선스, 예외는 deploy/rhwp/deny.toml의 HWP 용도 승인분만).
  # 입력(deploy/rhwp의 네 파일)이 같으면 앞서 만든 결과를 다시 쓴다. 고지 파일이 그 결과와 같은지도 본다.
  # 권고 검사는 모든 PR에서 돈다(#155 승인 조건). 감사 작업 공간이 빌드 결과 안에 있어 캐시 복원·cargo xtask rhwp도 늘 돌고
  # (같은 입력이면 재사용, 캐시가 없을 때만 빌드), 경로 조건(rhwp 출력)은 고지 비교에만 건다.
  rhwp:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE: ghcr.io/fvoci/groundzero-ci-base@${{ vars.CI_BASE_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rhwp
          key: rhwp-${{ hashFiles('deploy/rhwp/build.sh', 'deploy/rhwp/inputs.env', 'deploy/rhwp/Cargo.lock', 'deploy/rhwp/deny.toml') }}
      - run: cargo xtask rhwp
      - if: needs.changes.outputs.rhwp != 'false'
        run: git diff --exit-code -- deploy/rhwp/THIRD_PARTY_NOTICES.txt
      # 다시 빌드하지 않은 실행에서도 새 보안 권고를 놓치지 않게 권고만 매번 새 DB로 다시 본다(cargo-deny는 베이스 이미지 안).
      - name: cargo xtask rhwp --audit (base image)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/work" --workdir /work
          --env HOME=/work/target/ci-home
          --env CARGO_HOME=/work/target/ci-cargo
          "$IMAGE" cargo xtask rhwp --audit
