# 제품 이미지 릴리스(D-87). 릴리스 태그(vX.Y.Z)가 가리키는 커밋을 deploy/docker/app.Dockerfile로 빌드해
# ghcr.io/fvoci/groundzero:X.Y.Z 로 게시한다. latest는 만들지 않는다. 검사 도구 이미지(groundzero-ci-base)와 다르다.
#
# - 트리거: v* 태그 push, 또는 수동 실행(workflow_dispatch)에 이미 있는 태그 입력(예: v0.0.1). 태그를 만들거나 옮기지 않는다.
# - 태그는 형식(vX.Y.Z), 원격 존재, main에 들어간 커밋인지 확인한 뒤 그 커밋을 정확히 checkout한다(main 최신을 빌드하지 않음).
# - 플랫폼마다 GitHub-hosted 네이티브 무료 러너(ubuntu-24.04, ubuntu-24.04-arm)에서 한 번씩 빌드해 digest로만 올리고,
#   받아 smoke 검사를 통과한 뒤에만 manifest를 합쳐 태그를 붙인다. 한 플랫폼이라도 실패하면 태그를 붙이지 않는다.
# - 같은 이미지 태그가 이미 있으면 그 이미지의 소스 SHA(org.opencontainers.image.revision)를 본다. 같으면 아무것도 바꾸지
#   않고 끝내고, 다르면 실패한다(다른 산출물로 덮지 않는다). 같은 릴리스는 concurrency로 한 번에 하나만 돈다.
# - pull_request는 Dockerfile·이 워크플로·의존성 입력(Cargo·pnpm manifest와 잠금, 툴체인)이 바뀔 때 게시 권한 없이
#   두 플랫폼 빌드와 smoke 검사만 한다.
# - 게시 권한(packages: write)은 게시 job에만, 기존 GITHUB_TOKEN만 쓴다.
name: release-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '이미 있는 릴리스 태그 (예: v0.0.1)'
        required: true
        type: string
  pull_request:
    paths:
      - deploy/docker/app.Dockerfile
      - .github/workflows/release-image.yml
      # 제품 이미지가 쓰는 의존성·도구 입력(Cargo·pnpm manifest와 잠금, 툴체인). 바뀌면 두 플랫폼 빌드·smoke만 한다.
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**/Cargo.toml
      - xtask/Cargo.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - apps/**/package.json
      - packages/**/package.json

permissions: {}

concurrency:
  group: release-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (inputs.tag || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/fvoci/groundzero
  # 이미지 태그가 있는지: `absent` 또는 `present`를 쓰고, 판단할 수 없으면(경로·권한·네트워크) 실패한다. 인자: 이미지
  # (ghcr.io/소유자/이름), 태그. 필요한 환경: ACTOR, GH_TOKEN(GITHUB_TOKEN, packages: read 이상).
  # 아직 한 번도 게시하지 않은 패키지는 레지스트리가 404가 아니라 거부로 답하므로 GitHub 패키지 API로 먼저 가린다. 소유자가
  # 사용자인지 조직인지(fvoci는 사용자) 확인해 맞는 경로(/users·/orgs)를 쓰고, "없음"은 그 경로가 "Package not found."로
  # 답한 404일 때만 인정한다(다른 404·401·403은 실패, 이미지 없음으로 보지 않는다).
  TAG_STATE: |
    set -euo pipefail
    repo="${1#ghcr.io/}"; ref="$2"; owner="${repo%%/*}"; name="${repo#*/}"
    api() {
      curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/$1"
    }
    resp=$(api "users/$owner")
    [ "$(tail -n1 <<<"$resp")" = 200 ] || { echo "::error::owner $owner lookup returned HTTP $(tail -n1 <<<"$resp")" >&2; exit 1; }
    case "$(sed '$d' <<<"$resp" | jq -r .type)" in
      User) base=users ;;
      Organization) base=orgs ;;
      *) echo "::error::owner $owner has an unexpected type" >&2; exit 1 ;;
    esac
    resp=$(api "$base/$owner/packages/container/$name")
    code=$(tail -n1 <<<"$resp"); message=$(sed '$d' <<<"$resp" | jq -r '.message // empty' 2>/dev/null || true)
    case "$code" in
      200) ;;
      404)
        if [ "$message" = "Package not found." ]; then echo absent; exit 0; fi
        echo "::error::package lookup $base/$owner/$name returned 404 ($message), not a missing package" >&2; exit 1 ;;
      *) echo "::error::package lookup $base/$owner/$name returned HTTP $code ($message)" >&2; exit 1 ;;
    esac
    resp=$(curl -sS -w '\n%{http_code}' -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull")
    [ "$(tail -n1 <<<"$resp")" = 200 ] || { echo "::error::registry token returned HTTP $(tail -n1 <<<"$resp")" >&2; exit 1; }
    token=$(sed '$d' <<<"$resp" | jq -r .token)
    code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
      -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
      "https://ghcr.io/v2/$repo/manifests/$ref")
    case "$code" in
      404) echo absent ;;
      200) echo present ;;
      *) echo "::error::manifest lookup returned HTTP $code" >&2; exit 1 ;;
    esac
  # 같은 이미지 태그가 이미 있을 때: 그 이미지의 소스 SHA(revision 라벨)가 기대한 SHA와 같으면 `true`(그대로 두고 끝),
  # 없으면 `false`(빌드), 다르면 실패(덮어쓰지 않는다). 인자: 이미지, 태그, 기대 SHA. 환경은 TAG_STATE와 같다.
  EXISTING: |
    set -euo pipefail
    image="$1"; ref="$2"; sha="$3"
    state=$(bash -c "$TAG_STATE" tag-state "$image" "$ref")
    if [ "$state" = absent ]; then echo false; exit 0; fi
    revisions=$(docker buildx imagetools inspect "$image:$ref" --format '{{json .Image}}' \
      | jq -r 'if has("config") then .config.Labels["org.opencontainers.image.revision"] else [.[] | .config.Labels["org.opencontainers.image.revision"]? // empty] | unique | join(",") end')
    digest=$(docker buildx imagetools inspect "$image:$ref" --format '{{json .Manifest}}' | jq -r .digest)
    if [ "$revisions" != "$sha" ]; then
      echo "::error::$image:$ref already exists ($digest) built from '$revisions', not $sha. Not overwriting." >&2
      exit 1
    fi
    echo "- $image:$ref already published from \`$sha\` ($digest). Nothing rebuilt or changed." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
    echo true
  # 이미지 smoke 검사: 플랫폼, 실행 사용자, OCI 라벨(소스 SHA·버전), 웹 자산·HWP 미리보기 WASM·
  # 제3자 고지 포함. 소스가 버전 주입을 지원하면(inject=true) 빌드 인자와 같은 값이 컴파일 결과(`fvoci-server version`),
  # 시작 로그(server.starting의 version·source), 버전 응답(/healthz의 build)에 모두 나와야 한다. 서버는 시작할 때 DB 기준을
  # 확인하므로(db::Db::check_baseline) 시험 Compose의 PostgreSQL을 실행마다 새로 띄우고(tmpfs), 이미지의 `db bootstrap`·
  # `db migrate`로 준비한 뒤 앱 역할로 띄운다. 자격 증명은 시험 값이다. 실패하면 정리 전에 로그를 남긴다.
  # 인자: 이미지, 플랫폼, 소스 SHA, 버전, inject. 환경: SMOKE_RUN(실행 식별자, 없으면 로컬용으로 새로 만든다), SMOKE_RECOVER.
  #
  # 실행 소유 자원(#125, D-126 (4)). 실행 식별자는 무엇을 만들기 전에 정해 출력하고, 이 실행이 만드는 컨테이너·네트워크마다
  # 소유 라벨 fvoci.smoke=<식별자>를 단다(시험 Compose의 자원에는 덮어쓰는 구성으로). 만들기 전에 그 식별자의 라벨·이름·
  # Compose 프로젝트를 쓰는 자원이 하나라도 있으면 건드리지 않고 멈춘다. 그래서 그 뒤 이 라벨을 단 자원은 이 실행이 만든 것이고,
  # 만들기와 ID 받기 사이에 끊겨도 라벨로 정확히 찾는다. 지우는 일은 SMOKE_RECOVER 하나가 한다.
  # - 실패와 SIGINT·SIGTERM·SIGHUP: 진행 중인 단계(자식)를 SIGTERM으로 끝내고 실패와 같은 정리 경로를 지난다. 진단 로그를 남기고
  #   이 실행의 자원만 지운 뒤 실패로 끝난다. 신호면 "interrupted by SIG…"를 남기고 128+신호 번호로 끝난다. 단계 셸이 이 셸을
  #   `exec`로 띄워 러너의 신호가 바로 이 셸에 온다.
  # - 강제로 끝난 실행(SIGKILL, 취소·시간 초과 끝에 러너가 프로세스를 죽인 경우, PR은 cancel-in-progress로 생길 수 있다): 정리
  #   경로를 못 지난다. job의 다음 `always()` 단계가 같은 SMOKE_RUN으로 SMOKE_RECOVER를 돌린다. 로컬에서는 시작할 때 출력한
  #   복구 명령을 저장소 루트에서 돌린다. 덮어쓰는 구성의 임시 파일(TMPDIR)도 남는다. Docker 자원이 아니고 DB 내용도 없다.
  # - 다른 실행의 자원과 볼륨·백업은 건드리지 않는다. 넓은 탐색 삭제·prune·`--volumes`를 쓰지 않는다.
  # - 시험 PostgreSQL은 tmpfs라(볼륨 없음) 컨테이너를 멈추거나 지우면 DB 내용이 사라진다. 명시적 보존 요청은 자동 정리보다
  #   우선하지만 이 smoke는 그 요청을 받는 옵션이 없어 정리와 복구가 늘 돈다. 실패의 증거로는 컨테이너 대신 진단 로그를 남긴다.
  #   보존 요청이 있든 없든 이 실행이 만들지 않은 자원은 정리·복구 대상이 아니다.
  SMOKE: |
    set -euo pipefail
    ref="$1"; platform="$2"; revision="$3"; version="$4"; inject="$5"
    run="${SMOKE_RUN:-fvoci-smoke-local-$(date +%s)-$$}"
    fail() { echo "::error::$platform: $*"; exit 1; }
    [[ "$run" =~ ^fvoci-smoke-[a-z0-9][a-z0-9_-]*$ ]] || fail "'$run' is not a smoke run identifier"
    echo "smoke run $run. If it is killed, remove only its resources from the repository root:" \
      "bash -c \"\$SMOKE_RECOVER\" recover $run"
    existing=$(docker ps -aq --filter "label=fvoci.smoke=$run"; docker ps -aq --filter "label=com.docker.compose.project=$run"
      docker network ls -q --filter "label=fvoci.smoke=$run"; docker network ls -q --filter "label=com.docker.compose.project=$run"
      docker ps -a --format '{{.ID}} {{.Names}}' | awk -v n="$run" '$2 == n { print $1 }'
      docker network ls --format '{{.ID}} {{.Name}}' | awk -v n="${run}_default" '$2 == n { print $1 }')
    [ -z "$existing" ] || fail "resources of $run already exist; not touching them: $(echo $existing)"
    signal=""; child=""; labels=""
    cleanup() {
      local status="$1"
      trap - EXIT INT TERM HUP
      if [ -n "$child" ]; then kill -TERM "$child" 2>/dev/null || true; wait "$child" 2>/dev/null || true; fi
      if [ -n "$labels" ]; then rm -f "$labels"; fi
      if [ "$status" != 0 ]; then
        for id in $(docker ps -aq --filter "label=fvoci.smoke=$run"); do docker logs "$id" 2>&1 | tail -n 50 || true; done
      fi
      bash -c "$SMOKE_RECOVER" recover "$run" || status=1
      if [ -n "$signal" ]; then echo "::error::$platform: interrupted by SIG$signal"; fi
      exit "$status"
    }
    trap 'cleanup $?' EXIT
    trap 'signal=INT; exit 130' INT
    trap 'signal=TERM; exit 143' TERM
    trap 'signal=HUP; exit 129' HUP
    # 셸은 앞에서 도는 자식이 끝나야 신호 처리기를 돌리므로 오래 걸리는 단계는 뒤에서 돌리고 기다린다. 자식이 명령 자체가 되도록
    # 셸 함수가 아닌 명령만 넘긴다(함수면 하위 셸이 자식이 되어 SIGTERM이 그 안의 명령에 닿지 않는다).
    step() { "$@" & child=$!; local status=0; wait "$child" || status=$?; child=""; return "$status"; }
    actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")
    [ "$actual" = "$platform" ] || fail "platform $actual, expected $platform"
    # 이미지 크기 회귀를 실행 요약에서 본다(#138). 로컬 이미지 저장소의 크기이며 레지스트리의 압축 크기와 다르다.
    size=$(docker image inspect --format '{{.Size}}' "$ref")
    echo "image size: $platform $size bytes"
    echo "- $platform: image size $size bytes (docker image inspect)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
    label() { docker image inspect --format "{{index .Config.Labels \"org.opencontainers.image.$1\"}}" "$ref"; }
    [ "$(label revision)" = "$revision" ] || fail "revision label $(label revision), expected $revision"
    [ "$(label version)" = "$version" ] || fail "version label $(label version), expected $version"
    [ "$(docker run --rm --label "fvoci.smoke=$run" --entrypoint id "$ref" -u)" = 10001 ] || fail "not running as uid 10001"
    docker run --rm --label "fvoci.smoke=$run" --entrypoint sh "$ref" -c '
      set -e
      test -x /usr/local/bin/fvoci-server
      test -s /usr/share/doc/fvoci/THIRD_PARTY_NOTICES.txt
      test -s /srv/fvoci/web/THIRD_PARTY_NOTICES.txt
      test -s /srv/fvoci/web/index.html
      ls /srv/fvoci/web/rhwp/*/ | grep -q .
      test -d /data/files && test -d /backups' || fail "runtime files missing"
    want=$(jq -cn --arg v "$version" --arg s "$revision" '{version: $v, source: $s}')
    if [ "$inject" = true ]; then
      compiled=$(docker run --rm --label "fvoci.smoke=$run" "$ref" version | jq -c '{version, source}')
      [ "$compiled" = "$want" ] || fail "compiled build $compiled, expected $want"
      # 시험 Compose의 PostgreSQL 컨테이너와 기본 네트워크에 소유 라벨을 단다. 프로젝트 이름도 실행 식별자다.
      labels=$(mktemp)
      printf 'services:\n  postgres:\n    labels:\n      fvoci.smoke: %s\nnetworks:\n  default:\n    labels:\n      fvoci.smoke: %s\n' \
        "$run" "$run" >"$labels"
      db=(docker compose --project-name "$run" --file deploy/compose.test.yaml --file "$labels")
      step "${db[@]}" create postgres
      pg_id=$("${db[@]}" ps --all --quiet postgres)
      net_id=$(docker network ls --quiet --filter "label=fvoci.smoke=$run")
      [ "$(wc -w <<<"$pg_id")" = 1 ] && [ "$(wc -w <<<"$net_id")" = 1 ] || fail "postgres container or network of $run not found"
      echo "smoke resources: postgres $pg_id, network $net_id"
      step "${db[@]}" up --detach --wait --no-recreate postgres
      pg=postgres:5432/fvoci
      for cmd in bootstrap migrate; do
        step docker run --rm --label "fvoci.smoke=$run" --network "$net_id" \
          -e DATABASE_ADMIN_URL="postgres://fvoci:fvoci-test-password@$pg" \
          -e DATABASE_MIGRATION_URL="postgres://fvoci_migrator:fvoci-test-migrator-password@$pg" \
          -e FVOCI_DB_MIGRATOR_PASSWORD=fvoci-test-migrator-password -e FVOCI_DB_APP_PASSWORD=fvoci-test-app-password \
          "$ref" db "$cmd" || fail "db $cmd failed"
      done
      # 호스트 포트는 Docker가 고른다. 같은 호스트의 다른 실행과 겹치지 않는다.
      app=$(docker create --name "$run" --label "fvoci.smoke=$run" --network "$net_id" -p 127.0.0.1::8080 \
        -e DATABASE_URL="postgres://fvoci_app:fvoci-test-app-password@$pg" -e FVOCI_ROLE=api "$ref")
      echo "smoke resources: app $app"
      docker start "$app" >/dev/null
      port=$(docker port "$app" 8080/tcp | head -n1)
      port="${port##*:}"
      served=""
      for _ in $(seq 1 60); do
        served=$(curl -s "http://127.0.0.1:$port/healthz" | jq -c '.build // empty' 2>/dev/null || true)
        [ -n "$served" ] && break
        sleep 1
      done
      [ "$served" = "$want" ] || fail "/healthz build '$served', expected $want"
      logged=$(docker logs "$app" 2>&1 | jq -Rc 'fromjson? | select(.event? == "server.starting") | {version, source}' | head -n1)
      [ "$logged" = "$want" ] || fail "start log '$logged', expected $want"
      shown="$version (compiled, start log, /healthz and labels agree)"
    else
      # 주입 이전 소스(v0.0.1): 앱 안에는 버전이 없다. 라벨만 이 릴리스를 가리킨다.
      if docker run --rm --label "fvoci.smoke=$run" "$ref" version >/dev/null 2>&1; then
        fail "source without injection has a version command"
      fi
      shown="not in the app (source predates version injection); labels only"
    fi
    echo "smoke ok: $platform, revision $revision, version $shown"
    echo "- $platform: smoke ok. revision \`$revision\`, version $shown" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
  # 실행 소유 자원 복구(#125). 실행 식별자 하나를 받아 소유 라벨 fvoci.smoke가 정확히 그 값인 컨테이너·네트워크만 지운다. 라벨
  # 필터로 찾은 것을 inspect로 다시 확인하고, 볼륨은 지우지 않는다. 이름이나 Compose 프로젝트만 같고 소유 라벨이 없는 자원은 남기고
  # 경고한다. 지운 뒤에도 소유 자원이 남으면 실패한다. SMOKE의 정리 경로와 강제로 끝난 실행 뒤의 `always()` 단계가 함께 쓴다.
  # 인자: 실행 식별자.
  SMOKE_RECOVER: |
    set -euo pipefail
    run="$1"
    [[ "$run" =~ ^fvoci-smoke-[a-z0-9][a-z0-9_-]*$ ]] || { echo "::error::'$run' is not a smoke run identifier"; exit 1; }
    owner() { docker "$1" inspect --format "{{index $2 \"fvoci.smoke\"}}" "$3" 2>/dev/null || true; }
    removed=()
    for id in $(docker ps -aq --filter "label=fvoci.smoke=$run"); do
      if [ "$(owner container .Config.Labels "$id")" = "$run" ] && docker rm -f "$id" >/dev/null; then removed+=("container $id"); fi
    done
    for id in $(docker network ls -q --filter "label=fvoci.smoke=$run"); do
      if [ "$(owner network .Labels "$id")" = "$run" ] && docker network rm "$id" >/dev/null; then removed+=("network $id"); fi
    done
    echo "smoke recover $run: removed ${#removed[@]} (${removed[*]:-nothing})"
    left=$(docker ps -aq --filter "label=fvoci.smoke=$run"; docker network ls -q --filter "label=fvoci.smoke=$run")
    [ -z "$left" ] || { echo "::error::resources owned by $run are still there: $(xargs <<<"$left")"; exit 1; }
    others=$(docker ps -aq --filter "label=com.docker.compose.project=$run"
      docker network ls -q --filter "label=com.docker.compose.project=$run"
      docker ps -a --format '{{.ID}} {{.Names}}' | awk -v n="$run" '$2 == n { print $1 }'
      docker network ls --format '{{.ID}} {{.Name}}' | awk -v n="${run}_default" '$2 == n { print $1 }')
    if [ -n "$others" ]; then
      echo "::warning::left in place, no owner label fvoci.smoke=$run: $(sort -u <<<"$others" | xargs)"
    fi
  # smoke 수명주기 시험(#125). 실제 이미지로 SMOKE를 돌리되, PATH 앞에 둔 docker 대역이 호출 하나만 바꿔 그 지점의 실패·중단을
  # 만든다(나머지 호출은 진짜 docker로 넘긴다). 시나리오마다 실행 식별자를 따로 쓴다. 시험이 만든 미끼 자원에는
  # fvoci.smoke.check=<기준 식별자>를 달고, 끝날 때(실패해도) 그 미끼와 각 시나리오의 소유 자원만 지운다(SMOKE_RECOVER).
  # 인자: SMOKE와 같은 이미지·플랫폼·소스 SHA·버전(inject=true). 환경: SMOKE_RUN(기준 식별자), SMOKE, SMOKE_RECOVER.
  SMOKE_CHECK: |
    set -euo pipefail
    ref="$1"; platform="$2"; revision="$3"; version="$4"
    base="${SMOKE_RUN:-fvoci-smoke-local-$(date +%s)-$$}-check"
    work=$(mktemp -d)
    cases=()
    finish() {
      local status=$?
      for c in "${cases[@]}"; do bash -c "$SMOKE_RECOVER" recover "$c" >/dev/null || status=1; done
      for id in $(docker ps -aq --filter "label=fvoci.smoke.check=$base"); do docker rm -f "$id" >/dev/null || status=1; done
      for id in $(docker network ls -q --filter "label=fvoci.smoke.check=$base"); do
        docker network rm "$id" >/dev/null || status=1
      done
      rm -rf "$work"
      exit "$status"
    }
    trap finish EXIT
    # docker 대역. compose의 `create postgres`는 진짜로 만든 뒤(ID를 받기 전) SMOKE_SHIM대로 smoke 셸에 신호를 보낸다. term은
    # 우두머리(smoke 셸)에만(러너가 단계 프로세스에 보내듯), int는 그룹 전체에(터미널 Ctrl-C처럼), kill은 그룹 전체를 강제로
    # 끝낸다. term-stuck은 ID를 받은 뒤 compose `up`이 멈춘 것처럼 오래 걸리게 하고 우두머리에 SIGTERM을 보낸다. fail-bootstrap은
    # `db bootstrap` 실행만 실패시킨다(DB가 뜬 뒤의 실패).
    SMOKE_REAL_DOCKER=$(command -v docker)
    export SMOKE_REAL_DOCKER
    cat > "$work/docker" <<'EOF'
    #!/usr/bin/env bash
    set -uo pipefail
    args=" $* "
    if [ "${SMOKE_SHIM:-}" = term-stuck ] && [ "$1" = compose ] && [[ "$args" == *" up "* ]]; then
      kill -s TERM "$(ps -o pgid= -p $$ | tr -d ' ')"
      exec sleep 120
    fi
    if [ "$1" = compose ] && [[ "$args" == *" create postgres "* ]]; then
      "$SMOKE_REAL_DOCKER" "$@" || exit
      leader=$(ps -o pgid= -p $$ | tr -d ' ')
      case "${SMOKE_SHIM:-}" in
        term) kill -s TERM "$leader" ;;
        int) kill -s INT -- "-$leader" ;;
        kill) kill -s KILL -- "-$leader" ;;
      esac
      exit 0
    fi
    if [ "${SMOKE_SHIM:-}" = fail-bootstrap ] && [ "$1" = run ] && [[ "$args" == *" db bootstrap "* ]]; then
      echo "docker stand-in: db bootstrap fails" >&2
      exit 1
    fi
    exec "$SMOKE_REAL_DOCKER" "$@"
    EOF
    chmod +x "$work/docker"
    expect() { [ "$2" = "$3" ] || { echo "::error::$1: got '$2', expected '$3'"; exit 1; }; }
    has() { grep -qF -- "$2" "$work/$1.log" || { echo "::error::$1: no '$2' in output"; cat "$work/$1.log"; exit 1; }; }
    lacks() { ! grep -qF -- "$2" "$work/$1.log" || { echo "::error::$1: '$2' in output"; cat "$work/$1.log"; exit 1; }; }
    owned() { echo $(($(docker ps -aq --filter "label=fvoci.smoke=$1" | wc -l) + $(docker network ls -q --filter "label=fvoci.smoke=$1" | wc -l))); }
    # 남은 자원은 소유 라벨이 빠진 것도 세도록 Compose 프로젝트 라벨로도 찾는다.
    left() {
      { docker ps -aq --filter "label=fvoci.smoke=$1"; docker ps -aq --filter "label=com.docker.compose.project=$1"
        docker network ls -q --filter "label=fvoci.smoke=$1"; docker network ls -q --filter "label=com.docker.compose.project=$1"; } \
        | sort -u | wc -l
    }
    decoy() { docker create --label "fvoci.smoke.check=$base" "$@" --entrypoint true "$ref" >/dev/null; }
    # 시나리오 하나: 새 프로세스 그룹에서 SMOKE를 돌린다(대역이 그 그룹에 신호를 보낸다). 출력은 $work/<이름>.log, 종료 코드는 $code.
    # 임시 파일도 $work에 만들게 해 강제 종료로 남은 것까지 시험이 지운다.
    smoke() {
      cases+=("$base-$1")
      set -m
      SMOKE_RUN="$base-$1" SMOKE_SHIM="$2" PATH="$work:$PATH" TMPDIR="$work" \
        bash -c "$SMOKE" smoke "$ref" "$platform" "$revision" "$version" true >"$work/$1.log" 2>&1 &
      set +m
      code=0
      wait "$!" || code=$?
    }
    # 다른 실행의 소유 자원. 어느 시나리오도 지우면 안 된다.
    decoy --label "fvoci.smoke=$base-other"
    docker network create --label "fvoci.smoke=$base-other" --label "fvoci.smoke.check=$base" "$base-other" >/dev/null

    decoy --name "$base-exists"
    smoke exists ""
    expect "existing name: exit" "$code" 1
    has exists "resources of $base-exists already exist"
    expect "existing name: kept" "$(docker ps -aq --filter "name=^$base-exists\$" | wc -l)" 1
    decoy --label "fvoci.smoke=$base-leftover"
    smoke leftover ""
    expect "existing owner label: exit" "$code" 1
    has leftover "resources of $base-leftover already exist"
    expect "existing owner label: kept" "$(owned "$base-leftover")" 1
    echo "ok: refuses to start over existing resources (same name, same owner label) and leaves them"

    smoke fail fail-bootstrap
    expect "normal failure: exit" "$code" 1
    has fail "db bootstrap failed"
    has fail "ready to accept connections"
    lacks fail "interrupted"
    expect "normal failure: resources left" "$(left "$base-fail")" 0
    echo "ok: normal failure after the DB is up keeps diagnostics and removes only its resources"

    smoke term term
    expect "SIGTERM: exit" "$code" 143
    has term "interrupted by SIGTERM"
    lacks term "smoke resources:"
    expect "SIGTERM: resources left" "$(left "$base-term")" 0
    echo "ok: SIGTERM to the smoke shell between create and ID record cleans up as a failure"

    smoke int int
    expect "SIGINT: exit" "$code" 130
    has int "interrupted by SIGINT"
    lacks int "smoke resources:"
    expect "SIGINT: resources left" "$(left "$base-int")" 0
    echo "ok: SIGINT to the process group between create and ID record cleans up as a failure"

    SECONDS=0
    smoke stuck term-stuck
    took=$SECONDS
    expect "SIGTERM in a hung step: exit" "$code" 143
    has stuck "smoke resources: postgres"
    has stuck "interrupted by SIGTERM"
    [ "$took" -lt 30 ] || { echo "::error::SIGTERM in a hung step: took ${took}s, the step was not stopped"; exit 1; }
    expect "SIGTERM in a hung step: resources left" "$(left "$base-stuck")" 0
    echo "ok: SIGTERM while a step hangs stops that step at once and cleans up as a failure"

    smoke kill kill
    expect "forced kill: exit" "$code" 137
    lacks kill "smoke resources:"
    expect "forced kill: resources left for recovery" "$(owned "$base-kill")" 2
    bash -c "$SMOKE_RECOVER" recover "$base-kill" >"$work/recover.log" 2>&1
    has recover "removed 2"
    expect "forced kill: resources after recovery" "$(left "$base-kill")" 0
    echo "ok: forced kill between create and ID record leaves the resources to SMOKE_RECOVER, which removes exactly them"

    m="$base-mismatch"
    decoy --name "$m"
    decoy --label "com.docker.compose.project=$m"
    decoy --label "fvoci.smoke=$m-x"
    docker network create --label "com.docker.compose.project=$m" --label "fvoci.smoke.check=$base" "${m}_default" >/dev/null
    before=$(docker ps -aq --filter "label=fvoci.smoke.check=$base" | wc -l)
    bash -c "$SMOKE_RECOVER" recover "$m" >"$work/mismatch.log" 2>&1
    has mismatch "removed 0"
    has mismatch "left in place, no owner label fvoci.smoke=$m"
    expect "owner label mismatch: containers kept" "$(docker ps -aq --filter "label=fvoci.smoke.check=$base" | wc -l)" "$before"
    expect "owner label mismatch: network kept" "$(docker network ls -q --filter "name=${m}_default" | wc -l)" 1
    echo "ok: recovery leaves resources whose name or Compose project matches but whose owner label does not"

    expect "other run: resources kept" "$(owned "$base-other")" 2
    echo "ok: another run's owned container and network were never touched"
    echo "- $platform: smoke lifecycle checks ok (#125)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

jobs:
  # 태그 확인과 이미 게시된 이미지 확인. 읽기 권한만.
  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      created: ${{ steps.tag.outputs.created }}
      inject: ${{ steps.tag.outputs.inject }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::'$tag' is not a release tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          # 원격 태그가 가리키는 커밋(주석 태그면 벗긴 커밋).
          refs=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          [ -n "$refs" ] || { echo "::error::tag $tag does not exist on the remote"; exit 1; }
          sha=$(awk -v t="refs/tags/$tag^{}" '$2 == t { print $1 }' <<<"$refs")
          [ -n "$sha" ] || sha=$(awk '{ print $1; exit }' <<<"$refs")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag moved during the run ($sha, event $GITHUB_SHA)"; exit 1
          fi
          # main에 들어간 커밋만 릴리스한다(병합 안 된 커밋에 붙인 태그로 게시하지 않게).
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...main" --jq .status)
          case "$status" in ahead|identical) ;; *) echo "::error::$sha is not on main ($status)"; exit 1 ;; esac
          created=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq .commit.committer.date)
          # 그 소스가 버전 주입(D-87)을 지원하는지: Dockerfile이 build arg를 받는가. 지원 이전 태그는 v0.0.1만 허용하고,
          # 그때는 앱 안 버전 표시 없이 라벨만 붙는다(빌드 인자를 넘겨도 반영되지 않으므로 반영된 것으로 보지 않는다).
          if gh api "repos/${GITHUB_REPOSITORY}/contents/deploy/docker/app.Dockerfile?ref=${sha}" --jq .content \
               | base64 -d | grep -q '^ARG FVOCI_RELEASE_VERSION='; then
            inject=true
          elif [ "$tag" = v0.0.1 ]; then
            inject=false
            echo "::warning::$tag predates version injection: the image gets OCI labels only, the app shows no version"
          else
            echo "::error::$tag source does not take FVOCI_RELEASE_VERSION/FVOCI_SOURCE_SHA build args"; exit 1
          fi
          {
            echo "tag=$tag"; echo "version=${tag#v}"; echo "sha=$sha"; echo "created=$created"; echo "inject=$inject"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag -> $sha (version injection: $inject)"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: existing
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.tag.outputs.sha }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exists=$(bash -c "$EXISTING" existing "$IMAGE" "$VERSION" "$SHA")
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION already published from this source: $exists"

  # 플랫폼마다 한 번 빌드해 digest로만 올리고(태그 없음), 받아 smoke 검사한다.
  build:
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      # smoke 실행 식별자(SMOKE). job이 시작할 때 정해지므로 smoke가 강제로 끝나도 복구 단계가 같은 값을 쓴다.
      SMOKE_RUN: fvoci-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Confirm the checked-out commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # 버전·SHA는 resolve가 태그에서 한 번 정한 값 하나만 쓴다(빌드 인자·라벨·smoke 기대값 모두). 주입 이전 소스는
          # 이 인자를 받지 않으므로 smoke가 앱 안에 버전이 없음을 확인한다.
          build-args: |
            FVOCI_RELEASE_VERSION=${{ needs.resolve.outputs.version }}
            FVOCI_SOURCE_SHA=${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.title=fvoci
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.created=${{ needs.resolve.outputs.created }}
          cache-from: type=gha,scope=release-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.runner }}
      - id: smoke
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          INJECT: ${{ needs.resolve.outputs.inject }}
        run: |
          docker pull --platform "$PLATFORM" "$REF"
          exec bash -c "$SMOKE" smoke "$REF" "$PLATFORM" "$SHA" "$VERSION" "$INJECT"
      - name: Remove smoke resources left by a forced stop
        if: always()
        run: bash -c "$SMOKE_RECOVER" recover "$SMOKE_RUN"
      - name: Keep the digest for the manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
          echo "- $PLATFORM digest: \`$DIGEST\` (not tagged until both platforms pass)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  # 두 플랫폼 digest를 한 manifest로 합쳐 X.Y.Z 태그를 붙인다. 붙이기 직전에 다시 확인해 덮어쓰지 않는다.
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(ls digests | wc -l)" -eq 2 ] || { echo "::error::expected two platform digests"; ls digests; exit 1; }
          # 붙이기 직전에 다시: 확실히 없을 때만 붙인다(조회 실패는 멈춤, 덮어쓰지 않는다).
          state=$(bash -c "$TAG_STATE" tag-state "$IMAGE" "$VERSION")
          [ "$state" = absent ] || { echo "::error::$IMAGE:$VERSION appeared during the run. Not overwriting."; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            $(printf "$IMAGE@sha256:%s " $(ls digests))
          inspect=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<<"$inspect")
          platforms=$(jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | join(", ")' <<<"$inspect")
          {
            echo "### $IMAGE:$VERSION"
            echo "- tag: \`$TAG\` -> source \`$SHA\`"
            echo "- platforms: $platforms"
            echo "- manifest digest: \`$digest\`"
            echo "- pull: \`docker pull $IMAGE:$VERSION\` or \`docker pull $IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # PR: 게시 권한 없이 두 플랫폼 빌드와 smoke 검사만.
  pr-build:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SMOKE_RUN: fvoci-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: groundzero:pr
          # 주입 경로를 같은 방식으로 확인하는 시험 값(게시하지 않음). 0.0.0은 릴리스 태그로 쓰지 않는다.
          build-args: |
            FVOCI_RELEASE_VERSION=0.0.0
            FVOCI_SOURCE_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.0.0
          cache-from: type=gha,scope=release-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.runner }}
      - name: Smoke (not published)
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ github.sha }}
        run: exec bash -c "$SMOKE" smoke groundzero:pr "$PLATFORM" "$SHA" 0.0.0 true
      # 수명주기는 플랫폼과 상관없으므로 한 플랫폼에서만 시험한다.
      - name: Smoke lifecycle checks (#125)
        if: matrix.platform == 'linux/amd64'
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ github.sha }}
        run: exec bash -c "$SMOKE_CHECK" check groundzero:pr "$PLATFORM" "$SHA" 0.0.0
      - name: Remove smoke resources left by a forced stop
        if: always()
        run: bash -c "$SMOKE_RECOVER" recover "$SMOKE_RUN"

  # PR: 기존 이미지 확인의 분기를 실제 GitHub·GHCR 응답으로 검증한다(게시 권한 없음). 이미 있는 공개 패키지
  # groundzero-ci-base(사용자 fvoci 소유), 한 번도 게시하지 않은 패키지, 없는 소유자, 토큰 없는 호출을 쓴다.
  guard-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      BASE: ghcr.io/fvoci/groundzero-ci-base
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Existing-image branches
        run: |
          set -euo pipefail
          expect() { [ "$2" = "$3" ] || { echo "::error::$1: got '$2', expected '$3'"; exit 1; }; echo "ok: $1 -> $2"; }
          must_fail() {
            local what="$1"; shift
            if out=$("$@" 2>&1); then echo "::error::$what should fail but gave '$out'"; exit 1; fi
            echo "ok: $what fails: $(tail -n1 <<<"$out")"
          }
          expect "never-published package" "$(bash -c "$TAG_STATE" s ghcr.io/fvoci/groundzero-guard-check-missing 1.0.0)" absent
          expect "missing tag of an existing package" "$(bash -c "$TAG_STATE" s "$BASE" guard-check-missing-tag)" absent
          # 있는 태그 하나(베이스 이미지는 커밋 SHA로 태그를 붙인다)와 그 이미지의 revision 라벨.
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${BASE#ghcr.io/}:pull" | jq -r .token)
          tag=$(curl -fsS -H "Authorization: Bearer $token" "https://ghcr.io/v2/${BASE#ghcr.io/}/tags/list" \
            | jq -r '.tags[]' | grep -E '^[0-9a-f]{40}$' | head -n1)
          [ -n "$tag" ] || { echo "::error::no commit tag found on $BASE"; exit 1; }
          revision=$(docker buildx imagetools inspect "$BASE:$tag" --format '{{json .Image}}' \
            | jq -r 'if has("config") then .config.Labels["org.opencontainers.image.revision"] else [.[] | .config.Labels["org.opencontainers.image.revision"]? // empty] | unique | join(",") end')
          echo "existing tag $BASE:$tag, revision $revision"
          expect "existing tag" "$(bash -c "$TAG_STATE" s "$BASE" "$tag")" present
          expect "existing tag, same source -> keep" "$(bash -c "$EXISTING" e "$BASE" "$tag" "$revision")" true
          must_fail "existing tag, other source -> refuse" bash -c "$EXISTING" e "$BASE" "$tag" 0000000000000000000000000000000000000000
          must_fail "unknown owner" bash -c "$TAG_STATE" s ghcr.io/fvoci-no-such-owner-7f3a9c/x 1.0.0
          must_fail "no token" env GH_TOKEN= bash -c "$TAG_STATE" s "$BASE" "$tag"
          echo "- existing-image branches checked against \`$BASE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
