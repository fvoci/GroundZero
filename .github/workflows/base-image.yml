# 공통 베이스(빌드·검사) 이미지. deploy/docker/dev.Dockerfile을 그대로 빌드한다.
# 제품 커밋마다 만들지 않는다: Dockerfile·도구 버전이 바뀔 때, 주 1회(보안 업데이트), 수동 실행 때만 돈다.
# push는 레지스트리와 공개 범위가 승인된 뒤 저장소 변수 FVOCI_DEV_IMAGE_PUSH=true로 켠다 (decisions.md O-32).
# 이 워크플로는 아직 GitHub Actions에서 실행해 보지 않았다.
name: base-image

on:
  push:
    branches: [main]
    paths:
      - deploy/docker/dev.Dockerfile
      - .github/workflows/base-image.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: vars.FVOCI_DEV_IMAGE_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.FVOCI_DEV_IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push when approved)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/dev.Dockerfile
          push: ${{ vars.FVOCI_DEV_IMAGE_PUSH == 'true' }}
          load: ${{ vars.FVOCI_DEV_IMAGE_PUSH != 'true' }}
          tags: ${{ vars.FVOCI_DEV_IMAGE || 'fvoci-dev' }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report digest
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
