# 공통 베이스(빌드·검사) 이미지. deploy/docker/dev.Dockerfile을 그대로 빌드해 GHCR 공개 패키지로 게시한다.
# 이미지 경로: ghcr.io/fvoci/groundzero-ci-base (결정 D-65). 도구와 필요한 의존성만 담고 제품 소스·시크릿은 넣지 않는다.
# 제품 커밋마다 만들지 않는다: Dockerfile·이 워크플로 변경, 주 1회(보안 업데이트), 수동 실행 때만 돈다.
# pull_request에서는 실행하지 않으므로 외부 PR 코드가 게시 권한으로 실행되는 일이 없다.
name: base-image

on:
  push:
    branches: [main]
    paths:
      - deploy/docker/dev.Dockerfile
      # 이미지가 미리 받는 pnpm 판(packageManager)의 정본.
      - package.json
      - .github/workflows/base-image.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/fvoci/groundzero-ci-base

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 게시 권한은 이 job에만 둔다.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/dev.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          echo "image=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
