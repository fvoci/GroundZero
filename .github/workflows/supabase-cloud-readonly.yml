# Manual checks only. The precheck stays main-only; inventory uses an explicitly reviewed commit.
name: supabase-cloud-readonly

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only operation
        required: true
        default: precheck
        type: choice
        options:
          - precheck
          - inventory
      reviewed_sha:
        description: Exact reviewed commit SHA for inventory (must equal the dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-cloud-readonly
  cancel-in-progress: false

jobs:
  precheck:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'fvoci/GroundZero' && github.ref == 'refs/heads/main' &&
          inputs.operation == 'precheck' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      # rust-toolchain.toml pins the toolchain. Build before injecting credentials.
      - name: Build xtask
        timeout-minutes: 12
        run: cargo build --locked --package xtask
      - name: Read-only session pooler precheck
        timeout-minutes: 1
        env:
          SUPABASE_TEST_HOST: ${{ secrets.SUPABASE_TEST_HOST }}
          SUPABASE_TEST_PORT: ${{ secrets.SUPABASE_TEST_PORT }}
          SUPABASE_TEST_DATABASE: ${{ secrets.SUPABASE_TEST_DATABASE }}
          SUPABASE_TEST_USER: ${{ secrets.SUPABASE_TEST_USER }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          SUPABASE_TEST_SSL_ROOT_CERT: ${{ secrets.SUPABASE_TEST_SSL_ROOT_CERT }}
        run: target/debug/xtask supabase-cloud-precheck --connect

  inventory:
    # Temporary, user-authorized inspection on this exact branch. Revert to main-only after inspection.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'fvoci/GroundZero' && github.actor == github.repository_owner &&
          github.ref == 'refs/heads/fvoci/leatherback' && inputs.operation == 'inventory' &&
          inputs.reviewed_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build inventory before credentials
        timeout-minutes: 12
        run: cargo build --locked --package xtask
      - name: Read-only recreation target inventory
        timeout-minutes: 2
        env:
          SUPABASE_TEST_HOST: ${{ secrets.SUPABASE_TEST_HOST }}
          SUPABASE_TEST_PORT: ${{ secrets.SUPABASE_TEST_PORT }}
          SUPABASE_TEST_DATABASE: ${{ secrets.SUPABASE_TEST_DATABASE }}
          SUPABASE_TEST_USER: ${{ secrets.SUPABASE_TEST_USER }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          SUPABASE_TEST_SSL_ROOT_CERT: ${{ secrets.SUPABASE_TEST_SSL_ROOT_CERT }}
        run: |
          mkdir -p target/cloud-inventory
          target/debug/xtask supabase-cloud-inventory --connect | tee target/cloud-inventory/report.json
      - name: Preserve sanitized target inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-inventory-${{ github.sha }}
          path: target/cloud-inventory/report.json
          if-no-files-found: ignore
          retention-days: 14
