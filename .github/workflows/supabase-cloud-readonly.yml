# One approved first installation. Evidence branch only; never merged into the product branch.
name: supabase-cloud-installed-target-verification

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed installation source SHA, equal to dispatch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-cloud-readonly
  cancel-in-progress: false

jobs:
  first-install:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'fvoci/GroundZero' && github.actor == github.repository_owner &&
          github.ref == 'refs/heads/fvoci/sql-consolidation-cloud-once' &&
          inputs.reviewed_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3; same pin as product CI
        with:
          save-if: ${{ !cancelled() }}
      - name: Build reviewed binaries and selected tests before credentials
        timeout-minutes: 20
        run: |
          cargo build --locked --package fvoci-server --features sqlx/tls-native-tls
          cargo build --locked --package xtask
          cargo test --locked --package fvoci-server --features sqlx/tls-native-tls --test first_flow --test db_context --test trash --no-run --message-format=json > target/cloud-install-test-artifacts.jsonl
      - name: Verify existing target and run approved synthetic app-role tests
        timeout-minutes: 9
        env:
          APPROVED_SHA: ${{ inputs.reviewed_sha }}
          SUPABASE_TEST_HOST: ${{ secrets.SUPABASE_TEST_HOST }}
          SUPABASE_TEST_PORT: ${{ secrets.SUPABASE_TEST_PORT }}
          SUPABASE_TEST_DATABASE: ${{ secrets.SUPABASE_TEST_DATABASE }}
          SUPABASE_TEST_USER: ${{ secrets.SUPABASE_TEST_USER }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          SUPABASE_TEST_SSL_ROOT_CERT: ${{ secrets.SUPABASE_TEST_SSL_ROOT_CERT }}
          SUPABASE_TEST_MIGRATOR_PASSWORD: ${{ secrets.SUPABASE_TEST_MIGRATOR_PASSWORD }}
          SUPABASE_TEST_APP_PASSWORD: ${{ secrets.SUPABASE_TEST_APP_PASSWORD }}
        run: |
          mkdir -p target/cloud-install
          target/debug/xtask supabase-cloud-verify --connect > target/cloud-install/report.json
      - name: Preserve sanitized installation evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-installed-verification-${{ github.sha }}
          path: target/cloud-install/report.json
          if-no-files-found: ignore
          retention-days: 14
