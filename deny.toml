# cargo-deny 설정. 라이선스 정책은 docs/decisions.md D-60.
# 허용 목록 밖의 크레이트는 여기서 예외로 추가하지 않고 보고해 승인을 받는다.

[graph]
all-features = false
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[licenses]
# 자체 크레이트는 publish = false. fvoci 자체 라이선스는 O-27에서 별도 결정.
private = { ignore = true }
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "PostgreSQL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
ignore = [
  # rsa 0.9.10 (openidconnect 4.0.1 경유). Marvin 공격은 RSA 개인키 연산(복호화·서명)의 타이밍 누출이다.
  # fvoci는 OIDC 제공자의 공개키로 ID 토큰 서명을 검증만 하고 RSA 개인키를 갖지 않는다.
  # 패치가 나오면 이 항목을 지운다. 기록: docs/development.md 9절.
  { id = "RUSTSEC-2023-0071", reason = "public-key signature verification only; no RSA private key operations in fvoci" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
