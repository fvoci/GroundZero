# Upper-major coverage uses the same tests and isolated services as the PostgreSQL 17 minimum.
# PostgreSQL 18 changed its image data directory; replace the tmpfs mount, rather than merging it.
services:
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    tmpfs: !override
      - /var/lib/postgresql
