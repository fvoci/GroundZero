[workspace]
resolver = "3"
members = ["crates/aggregates/calendar", "crates/core", "crates/db", "crates/domains/activity", "crates/domains/files", "crates/domains/organizations", "crates/domains/time", "crates/domains/work", "crates/http", "crates/server", "crates/storage", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "matched-path"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
# 작업 공간 crate. cargo-deny `wildcards = "deny"`(deny.toml)가 판 없는 경로 의존성을 거부하므로 판을 적는다.
# `[workspace.package]`의 version을 올리면 함께 올린다.
fvoci-activity = { path = "crates/domains/activity", version = "0.1.0" }
fvoci-calendar = { path = "crates/aggregates/calendar", version = "0.1.0" }
fvoci-core = { path = "crates/core", version = "0.1.0" }
fvoci-db = { path = "crates/db", version = "0.1.0" }
fvoci-files = { path = "crates/domains/files", version = "0.1.0" }
fvoci-http = { path = "crates/http", version = "0.1.0" }
fvoci-organizations = { path = "crates/domains/organizations", version = "0.1.0" }
fvoci-storage = { path = "crates/storage", version = "0.1.0" }
fvoci-time = { path = "crates/domains/time", version = "0.1.0" }
fvoci-work = { path = "crates/domains/work", version = "0.1.0" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
uuid = { version = "1", features = ["serde", "v7"] }
xshell = "0.2"

# 개발·시험 빌드의 디버그 정보(#158). 워크스페이스 crate는 패닉 역추적에 쓸 줄 정보만 남기고, 외부 crate는 디버그 정보
# 없이 빌드한다(역추적에 함수 이름은 남지만 줄은 없다). 디버거에서 지역 변수는 보이지 않는다. `test` 프로필은 `dev`를
# 물려받는다.
# 프로필을 바꾸면 `.github/workflows/ci.yml`의 rust-cache `prefix-key`를 올린다(캐시 키에 프로필이 들지 않는다).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 제품 이미지의 서버 바이너리(#138). 크기·빌드 시간 전후 측정은 #138 PR에 둔다. LTO는 fat이 thin보다 크기는 3%쯤 작지만
# 빌드 시간이 두 배 가까이 걸려 thin을 쓴다. opt-level은 기본(3)이다.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# 패닉은 펼침(unwind)으로 둔다. 첨부 본문 추출(search.rs)과 실시간 편집 검사(collab/room.rs)는 외부 해석기의 패닉을
# spawn_blocking의 JoinError로 받아 그 일만 실패로 처리한다. abort면 서버 프로세스 전체가 내려간다. 우리 코드의
# panic 금지는 Clippy 규칙(D-09)이 맡는다.
panic = "unwind"

# 품질 기준 D-09(docs/decisions/delivery.md#d-09). 선택 근거는 O-23 기록.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
# 그룹은 개별 lint 설정보다 우선순위를 낮춰야 개별 설정이 이긴다.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
allow_attributes_without_reason = "deny"
large_futures = "warn"
await_holding_lock = "deny"
# #170: BeautifulRust 모범 사례에서 고른 규칙(D-09 개정 2026-10-27). #[allow] 대신 이유를 단 #[expect]를 쓴다.
allow_attributes = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
string_add = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
wildcard_imports = "warn"
clone_on_ref_ptr = "warn"
fn_params_excessive_bools = "warn"
format_push_string = "warn"
